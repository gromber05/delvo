services:
  postgres:
    image: postgres:16
    container_name: delvo-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-delvo}
      - POSTGRES_USER=${POSTGRES_USER:-delvo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-delvo_password}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delvo} -d ${POSTGRES_DATABASE:-delvo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: delvo-backend
    working_dir: /app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "30667:8000"
    env_file:
      - .env
    environment:
      - STT_DEVICE=${STT_DEVICE:-cpu}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web-build:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: delvo-web-build
    working_dir: /app/web
    command: sh -c "corepack enable && pnpm install && pnpm run build && pnpm exec next start --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      - DELVO_BACKEND_URL=${DELVO_BACKEND_URL:-http://backend:8000}
    volumes:
      - ./:/app
      - web_node_modules:/app/web/node_modules
    depends_on:
      - backend
    ports:
      - "31667:3000"
    restart: unless-stopped

volumes:
  web_node_modules:
  postgres_data:
