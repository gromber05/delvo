[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
env =
    JWT_SECRET_KEY=test-secret-key-do-not-use-in-production
    JWT_ALGORITHM=HS256
    JWT_EXPIRE_MINUTES=60
    JWT_REFRESH_EXPIRE_DAYS=30
    DOCS_USER=admin
    DOCS_PASS=password
